services:
  - type: web
    name: tournament-hub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: DOTNET_HOSTBUILDER_RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      # Set this in the Render dashboard to your Neon connection string
      - key: ConnectionStrings__Default
        sync: false